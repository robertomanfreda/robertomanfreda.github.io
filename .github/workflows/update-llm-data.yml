name: Update LLM checker data

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-llm-data.yml"
      - "scripts/update-llm-data.py"
      - "public/data/model-overrides.json"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update catalog
        run: python scripts/update-llm-data.py

      - name: Validate catalog
        run: python scripts/update-llm-data.py --check --no-hub

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Materialize branch Pages root
        run: npm run materialize-pages

      - name: Commit changed data and Pages root
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update LLM checker data"
          file_pattern: "public/data/llm-models.json .nojekyll assets data respawn llm-model-checker favicon.ico index.html llm-model-checker.html respawn.html robots.txt site.webmanifest sitemap.xml"
