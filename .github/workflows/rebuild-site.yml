name: Rebuild site

# The site is static, but two things in it depend on the date: the Expires
# field of security.txt and the years of experience. A monthly rebuild keeps
# them current; nothing is committed when the output has not changed.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Materialize branch Pages root
        run: npm run materialize-pages

      # Everything the build writes lands at the repository root; dist/ and node_modules/ are ignored.
      - name: Commit the Pages root
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Rebuild site"
