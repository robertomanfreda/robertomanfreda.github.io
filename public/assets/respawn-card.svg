<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Respawn gateway architecture preview</title>
  <desc id="desc">A dark technical diagram showing Respawn between OpenAI SDKs, state storage, Ollama, tools, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset=".62" stop-color="#101218"/>
      <stop offset="1" stop-color="#180b13"/>
    </linearGradient>
    <linearGradient id="edge" x1="120" y1="120" x2="1080" y2="700">
      <stop offset="0" stop-color="#64ffda"/>
      <stop offset=".5" stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#64ffda" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <path d="M-80 700 1280 80" stroke="#ff4d8d" stroke-width="5" opacity=".22"/>
  <g opacity=".18">
    <path d="M0 130h1200M0 260h1200M0 390h1200M0 520h1200M0 650h1200"/>
    <path d="M120 0v820M260 0v820M400 0v820M540 0v820M680 0v820M820 0v820M960 0v820M1100 0v820"/>
  </g>
  <g stroke="#64ffda" stroke-width="1" opacity=".22">
    <path d="M0 130h1200M0 260h1200M0 390h1200M0 520h1200M0 650h1200"/>
    <path d="M120 0v820M260 0v820M400 0v820M540 0v820M680 0v820M820 0v820M960 0v820M1100 0v820"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="76" y="116" fill="#64ffda" font-size="22" font-weight="800">LOCAL RESPONSES API GATEWAY</text>
    <text x="76" y="190" fill="#f4f7fb" font-size="88" font-weight="900">Respawn</text>
    <text x="80" y="238" fill="#9aa3b2" font-size="28">OpenAI SDK shape. Self-hosted model runtime.</text>
  </g>

  <g filter="url(#glow)">
    <rect x="430" y="300" width="340" height="180" rx="18" fill="#101218" stroke="url(#edge)" stroke-width="3"/>
    <text x="600" y="365" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="900" text-anchor="middle">Respawn</text>
    <text x="600" y="415" fill="#64ffda" font-family="Consolas, Monaco, monospace" font-size="23" text-anchor="middle">/v1/responses</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M252 390h150" stroke="#64ffda"/>
    <path d="M798 390h150" stroke="#5aa7ff"/>
    <path d="M600 510v86" stroke="#ffd166"/>
    <path d="M482 505 322 604" stroke="#ff4d8d"/>
    <path d="M718 505 878 604" stroke="#64ffda"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="800">
    <g>
      <rect x="86" y="324" width="172" height="132" rx="14" fill="#0b0d12" stroke="#64ffda" stroke-opacity=".42"/>
      <text x="172" y="382" fill="#f4f7fb" font-size="25" text-anchor="middle">OpenAI SDK</text>
      <text x="172" y="419" fill="#64ffda" font-family="Consolas, Monaco, monospace" font-size="18" text-anchor="middle">client.responses</text>
    </g>
    <g>
      <rect x="950" y="324" width="172" height="132" rx="14" fill="#0b0d12" stroke="#5aa7ff" stroke-opacity=".42"/>
      <text x="1036" y="382" fill="#f4f7fb" font-size="25" text-anchor="middle">Ollama</text>
      <text x="1036" y="419" fill="#5aa7ff" font-family="Consolas, Monaco, monospace" font-size="18" text-anchor="middle">model runtime</text>
    </g>
    <g>
      <rect x="486" y="596" width="228" height="92" rx="14" fill="#0b0d12" stroke="#ffd166" stroke-opacity=".42"/>
      <text x="600" y="650" fill="#f4f7fb" font-size="24" text-anchor="middle">Stored state</text>
    </g>
    <g>
      <rect x="130" y="604" width="238" height="92" rx="14" fill="#0b0d12" stroke="#ff4d8d" stroke-opacity=".42"/>
      <text x="249" y="658" fill="#f4f7fb" font-size="24" text-anchor="middle">Tools + schema</text>
    </g>
    <g>
      <rect x="832" y="604" width="238" height="92" rx="14" fill="#0b0d12" stroke="#64ffda" stroke-opacity=".42"/>
      <text x="951" y="658" fill="#f4f7fb" font-size="24" text-anchor="middle">Metrics + logs</text>
    </g>
  </g>

  <g font-family="Consolas, Monaco, monospace" font-size="20">
    <rect x="76" y="730" width="1048" height="44" rx="12" fill="#080a0f" stroke="#64ffda" stroke-opacity=".26"/>
    <text x="100" y="759" fill="#64ffda">$</text>
    <text x="128" y="759" fill="#9aa3b2">stateful responses · SSE streams · tenant auth · Prometheus · Docker Compose</text>
  </g>
</svg>
